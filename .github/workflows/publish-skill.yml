name: Publish skill release

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-skill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and validate skill
    runs-on: ubuntu-latest

    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

      - name: Run tests
        run: python -m pytest -q

      - name: Smoke-test CLI
        shell: bash
        run: |
          set -euo pipefail
          python scripts/photo_grade.py --help
          python scripts/photo_grade.py analyze tests/test_photo.png > "${RUNNER_TEMP}/analyze.json"
          python scripts/photo_grade.py compare tests/test_photo.png tests/test_photo.png > "${RUNNER_TEMP}/compare.json"
          python tests/visual_regression.py --help
          python tests/visual_regression.py tests --output-dir "${RUNNER_TEMP}/visual-smoke"

  publish:
    name: Build and publish skill-python-photo-color-grade.zip
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Build skill-python-photo-color-grade.zip
        id: package
        shell: bash
        run: |
          set -euo pipefail

          build_dir="${RUNNER_TEMP}/skill-build"
          package_dir="${build_dir}/skill"
          asset_path="${RUNNER_TEMP}/skill-python-photo-color-grade.zip"

          rm -rf "${build_dir}"
          mkdir -p "${package_dir}"

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.hypothesis/' \
            --exclude='.pytest_cache/' \
            --exclude='__pycache__/' \
            --exclude='tests/' \
            --exclude='requirements-dev.txt' \
            --exclude='skill-python-photo-color-grade.zip' \
            ./ "${package_dir}/"

          (
            cd "${package_dir}"
            zip -q -r "${asset_path}" .
          )

          printf 'asset_path=%s\n' "${asset_path}" >> "${GITHUB_OUTPUT}"

      - name: Publish the GitHub Release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.package.outputs.asset_path }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          release_tag="skill-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          release_title="Skill build: ${GITHUB_REF_NAME} (${GITHUB_SHA::7})"
          release_notes="Automated build from branch ${GITHUB_REF_NAME}, commit ${GITHUB_SHA}."

          release_flags=(--prerelease --latest=false)
          if [[ "${GITHUB_REF_TYPE}" == "branch" && "${GITHUB_REF_NAME}" == "${DEFAULT_BRANCH}" ]]; then
            release_flags=(--latest)
          fi

          gh release create \
            "${release_tag}" \
            "${ASSET_PATH}" \
            --target "${GITHUB_SHA}" \
            --title "${release_title}" \
            --notes "${release_notes}" \
            "${release_flags[@]}" \
            --repo "${GITHUB_REPOSITORY}"
